<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f7">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1f29">
    <title>OnoFlow</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
</head>
<body>
<div class="app" id="app" data-tab="diagram" data-run-state="idle" data-loading>
    <header class="bar">
        <div class="bar-row bar-row--main">
            <span class="brand">OnoFlow</span>
            <div class="file-group">
                <div class="file">
                    <label class="visually-hidden" for="file-name" data-i18n="ui.fileName.label"></label>
                    <span class="file-field"><input class="file-name" id="file-name" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"></span>
                    <span class="modified" id="modified" data-i18n="ui.modified" hidden></span>
                </div>
                <p class="status" id="status" role="status" hidden></p>
            </div>
            <div class="history-controls history-controls--bar" role="group" data-i18n-label="ui.history.label">
                <button class="button history-button" id="undo" type="button" data-i18n-label="ui.undo" data-i18n-title="ui.undo.title" disabled>
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4.5L3.5 8 7 11.5"/><path d="M3.5 8h8.5a4 4 0 0 1 0 8H9"/></svg>
                </button>
                <button class="button history-button" id="redo" type="button" data-i18n-label="ui.redo" data-i18n-title="ui.redo.title" disabled>
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 4.5L16.5 8 13 11.5"/><path d="M16.5 8H8a4 4 0 0 0 0 8h3"/></svg>
                </button>
            </div>
            <button class="button theme-button" id="theme-toggle" type="button">
                <svg class="icon theme-icon theme-icon--sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v2.5M10 15.5V18M2 10h2.5M15.5 10H18M4.3 4.3l1.8 1.8M13.9 13.9l1.8 1.8M4.3 15.7l1.8-1.8M13.9 6.1l1.8-1.8"/></svg>
                <svg class="icon theme-icon theme-icon--moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z"/></svg>
            </button>
            <div class="run-controls">
                <button class="button button--primary" id="run" type="button">
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4.5v11l9-5.5z"/></svg>
                    <span class="button-label" data-i18n="ui.run"></span>
                </button>
                <button class="button" id="step" type="button" data-i18n-title="ui.step.title">
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4.5v11l7.5-5.5z"/><path d="M15.5 4.5v11"/></svg>
                    <span class="button-label" data-i18n="ui.step"></span>
                </button>
                <button class="button" id="pause" type="button" aria-pressed="false" disabled>
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4.5v11M13 4.5v11"/></svg>
                    <span class="button-label" id="pause-label" data-i18n="ui.pause"></span>
                </button>
                <button class="button" id="stop" type="button" disabled>
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10"/></svg>
                    <span class="button-label" data-i18n="ui.stop"></span>
                </button>
            </div>
            <div class="menu-anchor">
                <button class="button button--quiet menu-button" id="menu-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 6h13M3.5 10h13M3.5 14h13"/></svg>
                    <span class="menu-button-label" data-i18n="ui.menu"></span>
                </button>
                <div class="menu" id="menu" role="menu" data-i18n-label="ui.menu" hidden>
                    <p class="menu-heading" data-i18n="ui.menu.file"></p>
                    <button class="menu-item" id="cmd-new" type="button" role="menuitem" data-i18n="ui.new"></button>
                    <button class="menu-item" id="cmd-open" type="button" role="menuitem" data-i18n="ui.open"></button>
                    <button class="menu-item" id="cmd-save" type="button" role="menuitem" data-i18n="ui.save"></button>
                    <p class="menu-heading" data-i18n="ui.menu.examples"></p>
                    <div id="examples-list" role="group"></div>
                    <p class="menu-heading" data-i18n="ui.menu.run"></p>
                    <button class="menu-item" id="cmd-step" type="button" role="menuitem" data-i18n="ui.runStep"></button>
                    <p class="menu-heading" data-i18n="ui.menu.edit"></p>
                    <button class="menu-item" id="cmd-new-function" type="button" role="menuitem" data-i18n="ui.newFunction"></button>
                    <button class="menu-item" id="cmd-undo" type="button" role="menuitem" data-i18n="ui.undo" disabled></button>
                    <button class="menu-item" id="cmd-redo" type="button" role="menuitem" data-i18n="ui.redo" disabled></button>
                    <p class="menu-heading" data-i18n="ui.menu.about"></p>
                    <button class="menu-item" id="cmd-theme" type="button" role="menuitem"></button>
                    <button class="menu-item" id="cmd-info" type="button" role="menuitem" data-i18n="ui.info.open"></button>
                </div>
            </div>
        </div>
        <input class="visually-hidden" id="file-input" type="file" tabindex="-1" aria-hidden="true">
    </header>

    <div class="notices" id="notices"></div>

    <main class="work" id="work">
        <section class="pane pane--diagram" id="panel-diagram" role="tabpanel" aria-labelledby="tab-diagram">
            <div class="diagram-errors" id="diagram-errors" role="region" data-i18n-label="ui.diagram.errorsLabel" hidden></div>
            <div class="sheet" id="sheet" role="region" tabindex="0" data-i18n-label="ui.tab.diagram">
                <div class="sheet-content" id="sheet-content">
                    <div class="diagram-host" id="diagram"></div>
                </div>
                <footer class="footer">
                    <p class="footer-line">
                        <span data-i18n="ui.footer.short.independent"></span><span class="footer-sep" aria-hidden="true"> · </span><span id="footer-hosting"></span><span class="footer-sep" aria-hidden="true"> · </span><button class="footer-link" id="footer-info" type="button" data-i18n="ui.info.open"></button>
                    </p>
                </footer>
            </div>
            <section class="info-panel" id="info-panel" role="region" aria-labelledby="info-title" tabindex="-1" hidden>
                <div class="info-header">
                    <h2 class="info-title" id="info-title" data-i18n="ui.info.title"></h2>
                    <button class="button button--quiet" id="info-close" type="button" data-i18n="ui.notice.close"></button>
                </div>
                <p class="info-lead"><strong>OnoFlow</strong> · <span data-i18n="ui.subtitle"></span></p>
                <p data-i18n="ui.footer.independent"></p>
                <p data-i18n="ui.footer.ai"></p>
                <p id="info-hosting"></p>
                <p data-i18n="ui.info.session"></p>
                <p data-i18n="ui.info.license"></p>
            </section>
            <div class="selection-bar" id="selection-bar" role="group" data-i18n-label="ui.selection.label" hidden>
                <button class="button selection-edit" id="edit-block" type="button" data-i18n-title="ui.selection.edit">
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16l1-4 8.5-8.5 3 3L8 15z"/><path d="M11.5 5.5l3 3"/></svg>
                    <span class="button-label" data-i18n="ui.selection.edit"></span>
                </button>
                <button class="button selection-insert" id="insert-after" type="button">
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M7 10h6M10 7v6"/></svg>
                    <span data-i18n="ui.selection.insertAfter"></span>
                </button>
                <button class="button selection-move" id="move-block" type="button" data-i18n-title="ui.selection.move">
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5v15M2.5 10h15M7.5 5L10 2.5 12.5 5M7.5 15l2.5 2.5 2.5-2.5M5 7.5L2.5 10 5 12.5M15 7.5l2.5 2.5-2.5 2.5"/></svg>
                    <span class="button-label" data-i18n="ui.selection.move"></span>
                </button>
                <button class="button selection-delete" id="delete-block" type="button">
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10M9 9v4M11 9v4"/></svg>
                    <span class="button-label" data-i18n="ui.selection.delete"></span>
                </button>
            </div>
            <div class="history-controls history-controls--sheet" role="group" data-i18n-label="ui.history.label">
                <button class="button history-button" id="undo-sheet" type="button" data-i18n-label="ui.undo" data-i18n-title="ui.undo.title" disabled>
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4.5L3.5 8 7 11.5"/><path d="M3.5 8h8.5a4 4 0 0 1 0 8H9"/></svg>
                </button>
                <button class="button history-button" id="redo-sheet" type="button" data-i18n-label="ui.redo" data-i18n-title="ui.redo.title" disabled>
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 4.5L16.5 8 13 11.5"/><path d="M16.5 8H8a4 4 0 0 0 0 8h3"/></svg>
                </button>
            </div>
            <section class="variables-strip" id="variables-strip" data-i18n-label="ui.variablesPanel.label" hidden>
                <button class="variables-strip-toggle" id="variables-strip-toggle" type="button" aria-expanded="false" aria-controls="variables-strip-body">
                    <span class="variables-strip-summary" id="variables-strip-summary"></span>
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 12.5L10 8l4.5 4.5"/></svg>
                </button>
                <div class="variables-strip-body" id="variables-strip-body" hidden></div>
            </section>
            <div class="step-controls">
                <button class="button step-sheet" id="step-sheet" type="button" data-i18n-title="ui.step.title">
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4.5v11l7.5-5.5z"/><path d="M15.5 4.5v11"/></svg>
                    <span data-i18n="ui.step"></span>
                </button>
            </div>
            <div class="zoom" role="group" data-i18n-label="ui.zoom.label">
                <button class="button zoom-button" id="zoom-out" type="button" data-i18n-label="ui.zoom.out" data-i18n-title="ui.zoom.out">
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg>
                </button>
                <button class="button zoom-level" id="zoom-reset" type="button"></button>
                <button class="button zoom-button" id="zoom-in" type="button" data-i18n-label="ui.zoom.in" data-i18n-title="ui.zoom.in">
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10M10 5v10"/></svg>
                </button>
                <button class="button zoom-button" id="zoom-fit" type="button" data-i18n-label="ui.zoom.fit" data-i18n-title="ui.zoom.fit">
                    <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 7.5v-4h4M12.5 3.5h4v4M16.5 12.5v4h-4M7.5 16.5h-4v-4"/></svg>
                </button>
            </div>
        </section>

        <section class="pane pane--console" id="panel-console" role="tabpanel" aria-labelledby="tab-console">
            <section class="variables-pane" id="variables-pane" data-i18n-label="ui.variablesPanel.label" hidden>
                <div id="variables-pane-body"></div>
            </section>
            <div class="slate" id="console-scroll">
                <p class="console-trimmed" id="console-trimmed" data-i18n="ui.console.trimmed" hidden></p>
                <p class="console-empty" id="console-empty" data-i18n="ui.console.empty"></p>
                <div class="console-log" id="console-log" role="log" aria-live="polite" data-i18n-label="ui.tab.console"></div>
            </div>
        </section>
    </main>

    <nav class="tabs" role="tablist" data-i18n-label="ui.tabs">
        <button class="tab" id="tab-diagram" type="button" role="tab" aria-controls="panel-diagram" aria-selected="true">
            <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="6" y="2.5" width="8" height="4" rx="2"/><path d="M10 6.5v3M5 9.5h10l-1.5 3h-7zM10 12.5v2"/><rect x="6" y="14.5" width="8" height="3" rx="1.5"/></svg>
            <span data-i18n="ui.tab.diagram"></span>
        </button>
        <button class="tab" id="tab-console" type="button" role="tab" aria-controls="panel-console" aria-selected="false" tabindex="-1">
            <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13"/><path d="M5.5 8l2.5 2-2.5 2M10 12.5h4"/></svg>
            <span data-i18n="ui.tab.console"></span>
        </button>
    </nav>
</div>

<script src="js/namespace.js"></script>
<script src="js/i18n/localization.js"></script>
<script src="js/i18n/catalog.it.js"></script>
<script src="js/core/number-format.js"></script>
<script src="js/core/expression-lexer.js"></script>
<script src="js/core/expression-parser.js"></script>
<script src="js/core/model.js"></script>
<script src="js/core/fprg-import.js"></script>
<script src="js/core/fprg-export.js"></script>
<script src="js/core/values.js"></script>
<script src="js/core/builtins.js"></script>
<script src="js/core/type-check.js"></script>
<script src="js/core/static-check.js"></script>
<script src="js/core/interpreter.js"></script>
<script src="js/core/scheduler.js"></script>
<script src="js/core/diagram-document.js"></script>
<script src="js/core/editor.js"></script>
<script src="js/core/history.js"></script>
<script src="js/examples/examples.js"></script>
<script src="js/ui/block-text.js"></script>
<script src="js/ui/diagram-layout.js"></script>
<script src="js/ui/diagram-renderer.js"></script>
<script src="js/ui/diagram-errors.js"></script>
<script src="js/ui/diagram-viewport.js"></script>
<script src="js/ui/block-menu.js"></script>
<script src="js/ui/block-editor.js"></script>
<script src="js/ui/console-view.js"></script>
<script src="js/ui/variables-view.js"></script>
<script src="js/ui/session-copy.js"></script>
<script src="js/ui/theme.js"></script>
<script src="js/app.js"></script>
<script>
    window.OnoFlow.App.start();
</script>
</body>
</html>
