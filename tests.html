<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Test di OnoFlow</title>
    <style>
        :root {
            --bg: #fbfaf7;
            --surface: #ffffff;
            --text: #1d1d1b;
            --muted: #6b6a66;
            --line: #e3e1da;
            --ok: #1f7a3f;
            --ok-bg: #e7f4ea;
            --ko: #b3261e;
            --ko-bg: #fbe9e7;
            --neutral-bg: #efeee9;
            --link: #1a5fb4;
            --mono: ui-monospace, "SFMono-Regular", "DejaVu Sans Mono", Menlo, Consolas, monospace;
            --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Cantarell, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #151513;
                --surface: #1e1e1b;
                --text: #ecebe6;
                --muted: #a3a29c;
                --line: #34332f;
                --ok: #7bd389;
                --ok-bg: #1b2e20;
                --ko: #ff8a80;
                --ko-bg: #3a1d1a;
                --neutral-bg: #2a2926;
                --link: #8ab4f8;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 16px/1.45 var(--sans);
        }
        main { max-width: 60rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
        h1 { font-size: 1.25rem; margin: 0 0 1rem; }
        h2 { font-size: 1rem; margin: 0 0 .5rem; }
        a { color: var(--link); }
        :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

        .filter { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .filter input {
            flex: 1 1 14rem; min-width: 0; font: inherit; padding: .5rem .625rem;
            color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
        }
        .filter button, .filter a {
            font: inherit; padding: .5rem .875rem; border-radius: 6px; border: 1px solid var(--line);
            background: var(--surface); color: var(--text); text-decoration: none; cursor: pointer;
        }

        .summary {
            display: flex; flex-wrap: wrap; gap: .25rem 1rem; align-items: baseline;
            padding: .875rem 1rem; border-radius: 8px; margin-bottom: 1rem; background: var(--neutral-bg);
        }
        .summary.is-passed { background: var(--ok-bg); color: var(--ok); }
        .summary.is-failed { background: var(--ko-bg); color: var(--ko); }
        .summary .counts, .summary .filter-note { color: var(--text); font-variant-numeric: tabular-nums; }

        .problems .problem {
            border: 1px solid var(--ko); border-radius: 8px; padding: .875rem 1rem; margin-bottom: 1rem;
            background: var(--ko-bg);
        }
        .problems .problem h2 { color: var(--ko); }
        .problems ul { margin: 0 0 .5rem; padding-left: 1.25rem; font-family: var(--mono); font-size: .875rem; }
        .problems p { margin: 0; }

        .suite { border-top: 1px solid var(--line); }
        .suite > summary {
            display: flex; gap: .625rem; align-items: baseline; padding: .625rem 0; cursor: pointer;
            list-style-position: outside;
        }
        .suite-status { color: var(--ok); width: 1ch; }
        .suite.is-failed .suite-status { color: var(--ko); }
        .suite-name { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .suite-counts { color: var(--muted); font-variant-numeric: tabular-nums; }
        .suite-only { font-size: .875rem; }

        .tests { list-style: none; margin: 0 0 .75rem; padding: 0; }
        .test { padding: .25rem 0 .25rem 1.625rem; }
        .test-name { display: flex; gap: .5rem; margin: 0; align-items: baseline; }
        .test-name a { color: inherit; text-decoration: none; flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .test-name a:hover { text-decoration: underline; }
        .test-status { width: 1ch; color: var(--ok); margin-left: -1.125rem; }
        .test.is-failed .test-status, .test.is-failed .test-name { color: var(--ko); }
        .test-duration { color: var(--muted); font-size: .8125rem; font-variant-numeric: tabular-nums; }
        .error-message {
            margin: .25rem 0; padding: .5rem .625rem; border-left: 3px solid var(--ko);
            background: var(--ko-bg); font-family: var(--mono); font-size: .875rem; white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .error-stack summary { color: var(--muted); font-size: .8125rem; cursor: pointer; }
        .error-stack pre { margin: .25rem 0; font-size: .75rem; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>

    <script>
        /*
         * Prima di ogni altro script: raccoglie gli script che non si caricano e gli errori
         * fuori dai test, per mostrarli nella pagina invece di lasciarla ferma (L-01, L-02).
         */
        window.OnoFlowTestBoot = { missingScripts: [], scriptErrors: [], onChange: null };
        window.addEventListener('error', function (event) {
            var boot = window.OnoFlowTestBoot;
            var target = event.target;
            if (target && target.tagName === 'SCRIPT') {
                boot.missingScripts.push(target.getAttribute('src'));
            } else {
                boot.scriptErrors.push({
                    message: event.message || 'errore sconosciuto',
                    source: event.filename || '',
                    line: event.lineno || 0
                });
            }
            if (boot.onChange) { boot.onChange(); }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
            var boot = window.OnoFlowTestBoot;
            var reason = event.reason;
            boot.scriptErrors.push({
                message: 'promessa rifiutata e non gestita: ' + (reason && reason.message ? reason.message : String(reason)),
                source: '',
                line: 0
            });
            if (boot.onChange) { boot.onChange(); }
        });
    </script>
</head>
<body>
<main>
    <h1>Test di OnoFlow</h1>

    <form class="filter" method="get" role="search">
        <label for="filtro" hidden>Filtro</label>
        <input id="filtro" name="filtro" type="search" placeholder="Filtra per suite o test"
               autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="submit">Filtra</button>
        <a href="?">Tutti</a>
    </form>

    <div id="summary" class="summary" role="status" aria-live="polite">
        Caricamento dei test…
        <noscript>Per eseguire i test serve JavaScript attivo.</noscript>
    </div>
    <section id="problems" class="problems" hidden></section>
    <section id="suites"></section>
</main>

<!--
    Ordine degli script (script classici, niente moduli ES: da file:// non funzionano):
      1. framework di test: assert.js → runner.js → report.js
      2. moduli dell'applicazione, nell'ordine di index.html (dai passi successivi)
      3. file di test, uno per modulo
-->
<script src="tests/framework/assert.js"></script>
<script src="tests/framework/runner.js"></script>
<script src="tests/framework/report.js"></script>

<script src="js/namespace.js"></script>
<script src="js/i18n/localization.js"></script>
<script src="js/i18n/catalog.it.js"></script>
<script src="js/core/number-format.js"></script>
<script src="js/core/expression-lexer.js"></script>
<script src="js/core/expression-parser.js"></script>
<script src="js/core/model.js"></script>
<script src="js/core/fprg-import.js"></script>
<script src="js/core/fprg-export.js"></script>
<script src="js/core/values.js"></script>
<script src="js/core/builtins.js"></script>
<script src="js/core/type-check.js"></script>
<script src="js/core/static-check.js"></script>
<script src="js/core/interpreter.js"></script>
<script src="js/core/scheduler.js"></script>
<script src="js/core/diagram-document.js"></script>
<script src="js/core/editor.js"></script>
<script src="js/core/history.js"></script>
<script src="js/examples/examples.js"></script>
<script src="js/ui/block-text.js"></script>
<script src="js/ui/diagram-layout.js"></script>
<script src="js/ui/diagram-renderer.js"></script>
<script src="js/ui/diagram-errors.js"></script>
<script src="js/ui/diagram-viewport.js"></script>
<script src="js/ui/block-menu.js"></script>
<script src="js/ui/block-editor.js"></script>
<script src="js/ui/console-view.js"></script>
<script src="js/ui/variables-view.js"></script>
<script src="js/ui/session-copy.js"></script>
<script src="js/ui/theme.js"></script>
<script src="js/app.js"></script>

<script src="tests/helpers.js"></script>

<script src="tests/framework/framework.test.js"></script>
<script src="tests/localization.test.js"></script>
<script src="tests/number-format.test.js"></script>
<script src="tests/expressions.test.js"></script>
<script src="tests/model.test.js"></script>
<script src="tests/format.test.js"></script>
<script src="tests/static-check.test.js"></script>
<script src="tests/type-check.test.js"></script>
<script src="tests/interpreter.test.js"></script>
<script src="tests/scheduler.test.js"></script>
<script src="tests/ui.test.js"></script>
<script src="tests/diagram.test.js"></script>
<script src="tests/document.test.js"></script>
<script src="tests/editor.test.js"></script>
<script src="tests/history.test.js"></script>
<script src="tests/files.test.js"></script>
<script src="tests/examples.test.js"></script>
<script src="tests/variables.test.js"></script>
<script src="tests/functions.test.js"></script>
<script src="tests/move.test.js"></script>
<script src="tests/theme.test.js"></script>
<script src="tests/block-editor.test.js"></script>

<script>
    (function () {
        var summary = document.getElementById('summary');
        if (!window.OnoFlowTest || !window.OnoFlowTest.runPage) {
            // Il framework non si è caricato: lo si dice invece di restare fermi (L-02).
            summary.className = 'summary is-failed';
            summary.textContent = 'Il framework di test non si è caricato. Se hai scaricato lo ZIP del progetto, ' +
                'estrailo tutto e apri tests.html dalla cartella estratta: aprendolo dal gestore di archivi ' +
                'viene estratto solo questo file. Altrimenti apri la console del browser (F12).';
            document.documentElement.setAttribute('data-test-status', 'failed');
            return;
        }

        var page = {
            summary: summary,
            problems: document.getElementById('problems'),
            suites: document.getElementById('suites'),
            filterInput: document.getElementById('filtro')
        };

        /*
         * Con ?dimostrazione la pagina carica anche test che falliscono di proposito e uno
         * script inesistente, per vedere come si presentano i problemi.
         */
        var demoScripts = ['tests/framework/demo-failures.js', 'tests/framework/script-inesistente.js'];
        var isDemo = new URLSearchParams(location.search).has('dimostrazione');
        var loading = !isDemo ? [] : demoScripts.map(function (source) {
            return new Promise(function (resolve) {
                var script = document.createElement('script');
                script.src = source;
                script.onload = resolve;
                script.onerror = resolve;
                document.body.appendChild(script);
            });
        });
        Promise.all(loading).then(function () {
            return window.OnoFlowTest.runPage(page, window.OnoFlowTestBoot);
        });
    })();
</script>
</body>
</html>
